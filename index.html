                  description: "Datos obtenidos correctamente",
                  content: {
                    "application/json": {
                      schema: {
                        type: "object",
                        properties: {
                          status: {
                            type: "string",
                            example: "ok",
                            description:
                              "ok (se encontraron datos del documento enviado), error (documento sin datos)",
                          },
                          data: {
                            type: "array",
                            description: "Lista de deudas encontradas",
                            items: {
                              type: "object",
                              properties: {
                                documento: {
                                  type: "string",
                                  example: "77777777",
                                  description: "Número de documento",
                                },
                                empresa: {
                                  type: "string",
                                  example: "BANCO ALFIN",
                                  description:
                                    "Nombre de la entidad financiera",
                                },
                                tipo_credito: {
                                  type: "string",
                                  example: "PRESTAMO",
                                  description: "Tipo de crédito",
                                },
                                monto: {
                                  type: "string",
                                  example: "118.00",
                                  description: "Monto de la deuda",
                                },
                                calificacion: {
                                  type: "string",
                                  example: "DEF",
                                  description: "Calificación crediticia",
                                },
                                dias_atraso: {
                                  type: "string",
                                  example: "41",
                                  description: "Días de atraso",
                                },
                                fecha: {
                                  type: "string",
                                  example: "2023-07-31",
                                  description: "Fecha del reporte",
                                },
                              },
                            },
                          },
                        },
                      },
                      example: {
                        status: "ok",
                        data: [
                          {
                            documento: "77777777",
                            empresa: "BANCO ALFIN",
                            tipo_credito: "PRESTAMO",
                            monto: "100.00",
                            calificacion: "DEF",
                            dias_atraso: "41",
                            fecha: "2023-07-31",
                          },
                          {
                            documento: "77777777",
                            empresa: "COMPARTAMOS FINANCIERA",
                            tipo_credito: "COMERCIAL",
                            monto: "200.00",
                            calificacion: "NOR",
                            dias_atraso: "0",
                            fecha: "2023-07-31",
                          },
                        ],
                      },
                    },
                  },
                },
              },
            },
          },
        },
      }

      Redoc.init(
        spec,
        {
          expandResponses: "200,404",
          requiredPropsFirst: true,
          hideDownloadButton: false,
          theme: {
            sidebar: {
              backgroundColor: "#fff",
              textColor: "#000",
            },
          },
        },
        document.getElementById("redoc-container"),
      )
      setTimeout(() => {
        const logo = document.querySelector('img[alt="API - SBI"]')
        if (logo && !document.querySelector(".sidebar-title-sbi")) {
          const label = document.createElement("span")
          label.textContent = "SBI – APIs"
          label.className = "sidebar-title-sbi"
          logo.parentNode.insertBefore(label, logo.nextSibling)
        }
      }, 500)
    </script>
  </body>
